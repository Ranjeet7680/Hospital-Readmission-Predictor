<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
    <defs>
        <linearGradient id="hrpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#005bbf" />
            <stop offset="60%" stop-color="#004a9e" />
            <stop offset="100%" stop-color="#002f6c" />
        </linearGradient>
        <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#e0edff" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Outer Rounded Shield / Badge Background -->
    <rect x="8" y="8" width="112" height="112" rx="32" fill="url(#hrpGrad)" />
    
    <!-- Outer Shield Border -->
    <rect x="8" y="8" width="112" height="112" rx="32" fill="none" stroke="#22d3ee" stroke-width="3" stroke-opacity="0.6" />

    <!-- Medical Shield Path Inside -->
    <path d="M64 22 L100 36 V68 C100 90 64 108 64 108 C64 108 28 90 28 68 V36 Z" 
          fill="rgba(255, 255, 255, 0.08)" 
          stroke="#ffffff" 
          stroke-width="3.5" 
          stroke-linejoin="round" />

    <!-- Pure Medical Cross Inside Shield -->
    <path d="M64 42 V86 M42 64 H86" 
          stroke="url(#crossGrad)" 
          stroke-width="10" 
          stroke-linecap="round" />

    <!-- AI Intelligence Interconnected Nodes & Synapses (Cyan) -->
    <!-- Center Core Node -->
    <circle cx="64" cy="64" r="5" fill="#22d3ee" filter="url(#glow)" />
    
    <!-- Top Node -->
    <circle cx="64" cy="42" r="4.5" fill="#22d3ee" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Bottom Node -->
    <circle cx="64" cy="86" r="4.5" fill="#22d3ee" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Left Node -->
    <circle cx="42" cy="64" r="4.5" fill="#22d3ee" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Right Node -->
    <circle cx="86" cy="64" r="4.5" fill="#22d3ee" stroke="#ffffff" stroke-width="1.5" />

    <!-- Diagonals Neural Pulse Nodes -->
    <circle cx="48" cy="48" r="2.5" fill="#38bdf8" />
    <circle cx="80" cy="48" r="2.5" fill="#38bdf8" />
    <circle cx="48" cy="80" r="2.5" fill="#38bdf8" />
    <circle cx="80" cy="80" r="2.5" fill="#38bdf8" />
</svg>
